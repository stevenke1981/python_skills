name: Validate and Package Codex Plugin

on:
  push:
    branches:
      - master
      - "agent/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-codex-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Verify plugin skill mirror
        run: python scripts/sync_plugin_skills.py --check

      - name: Validate plugin package
        run: python scripts/validate_plugin.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build deterministic plugin ZIP
        run: python scripts/package_plugin.py

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: python-engineering-skills
          path: dist/*.zip
          if-no-files-found: error
