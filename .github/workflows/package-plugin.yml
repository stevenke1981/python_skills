name: Validate and Package Codex Plugin

on:
  push:
    branches: [main, master, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-codex-plugin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.14"]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Validate source skills
        run: python scripts/validate_skills.py --strict
      - name: Validate skill mirror
        run: python scripts/sync_plugin_skills.py --check
      - name: Validate plugin manifest
        run: python scripts/validate_plugin.py
      - name: Run unit and extracted-package regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python tooling
        run: python -m compileall -q scripts tests
      - name: Smoke test POSIX wrapper
        if: runner.os != 'Windows'
        run: sh scripts/install_codex.sh --mode skills --home "${{ runner.temp }}/codex-wrapper-home" --dry-run
      - name: Smoke test PowerShell wrapper
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_codex.ps1 --mode skills --home "${{ runner.temp }}/codex-wrapper-home" --dry-run

  package:
    name: Validate and package
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Build deterministic plugin ZIP and SHA-256
        run: python scripts/package_plugin.py
      - name: Upload installable bundle
        uses: actions/upload-artifact@v4
        with:
          name: python-engineering-skills
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
